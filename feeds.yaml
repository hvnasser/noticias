  # Colunistas: buscas pelo nome. O filtro do tema só aceita o que vem do jornal
  # do colunista (WSJ para o Timiraos, Valor para o Alex Ribeiro).
  # Obs: "site:wsj.com" junto com o nome faz o Google News devolver o WSJ inteiro.
  - { fonte: Google News, categoria: colunistas_bc, url: "https://news.google.com/rss/search?q=%22Nick+Timiraos%22+when%3A2d&hl=en-US&gl=US&ceid=US:en" }
