  - { fonte: Bloomberg Línea, categoria: credito, url: "https://www.bloomberglinea.com.br/arc/outboundfeeds/rss/?outputType=xml" }

  # ---------- Bancos centrais (BCB, Fed, BCE, BoE, BoJ, PBoC) ----------
  - { fonte: Google News, categoria: bancos_centrais, url: "https://news.google.com/rss/search?q=%22Banco+Central%22+OR+Copom+OR+Gal%C3%ADpolo+OR+%22pol%C3%ADtica+monet%C3%A1ria%22+OR+%22Banco+Central+Europeu%22+OR+%22Banco+do+Jap%C3%A3o%22+OR+%22Banco+da+Inglaterra%22+OR+%22banco+central+chin%C3%AAs%22+when%3A1d&hl=pt-BR&gl=BR&ceid=BR:pt-419" }
