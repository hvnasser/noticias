# Temas do e-mail e seus filtros
#
# Cada tema tem FILTROS. Uma notícia entra no tema se passar em pelo menos um
# filtro ativo. Para ligar/desligar um filtro, use `ativo: true/false`.
#
# Em cada filtro:
#   palavras: basta UMA aparecer no título ou resumo para a notícia passar
#   exige:    (opcional) além disso, pelo menos UMA destas também precisa
#             aparecer. Serve para palavras ambíguas, ex: "spread" sozinho
#             pega "spread of the virus"; exigindo "bond" ou "crédito" junto,
#             só passa notícia de mercado.
#
# Regras das palavras:
#   - maiúsculas, acentos e hífens não importam ("risco-país" = "risco pais")
#   - a palavra tem que aparecer inteira: "default" não pega "defaulted"
#   - use * para aceitar qualquer final: "renegoci*" pega renegociação,
#     renegociar, renegociou...
#
# Em cada filtro também (opcional):
#   regiao:         brasil | mundo -> o filtro só pega notícias dessa região
#   separar_brasil: false -> no e-mail, não divide o filtro em Brasil / Mundo
#
# No tema:
#   categorias: só procura em notícias dessas categorias do feeds.yaml
#               (deixe vazio [] para procurar em todas)
#   excluir:    notícia com qualquer uma destas palavras sai do tema

# Notícia que saiu em vários sites: qual link vira o principal.
# A ordem vale conforme a região da notícia (Brasil ou Mundo); jornais fora da
# lista vêm depois. Um item pode ter vários nomes: [WSJ, Wall Street Journal].
prioridade_fontes:
  brasil:
    - Valor            # Valor Econômico, Valor Investe
    - Estadão
    - [O Globo, Globo, G1]    # O Globo e G1 contam como um só
    - Folha
  mundo:
    - [WSJ, Wall Street Journal]
    - [Financial Times, FT]
    - Reuters
    - Bloomberg

# IA: cada tarefa usa o modelo que você escolher.
#
# provedor: openrouter (padrão, chave OPENROUTER_API_KEY) ou anthropic
#           (direto na Anthropic, chave ANTHROPIC_API_KEY).
# Nomes dos modelos no OpenRouter: https://openrouter.ai/models
#   (ex: anthropic/claude-opus-5.5, anthropic/claude-sonnet-5.5,
#    anthropic/claude-haiku-5.5, openai/gpt-6-sol, google/gemini-3.6-flash,
#    deepseek/deepseek-v4.1-flash). Na Anthropic direta: claude-opus-5-5 etc.
# esforco: low | medium | high (só para modelos com raciocínio; apague a linha
#          para usar o padrão do modelo). Mais alto = melhor e mais caro.
# Sem chave, o e-mail sai com o trecho original do RSS.
ia:
  provedor: openrouter
  remover_irrelevantes: true   # tira do tema o que a IA marcar como fora do tema
  tarefas:
    relevancia:                # confirma se a notícia é mesmo do tema
      modelo: deepseek/deepseek-v4.1-flash
      esforco: low
      ativo: true
    resumo:                    # resumo de 1-2 frases em português
      modelo: deepseek/deepseek-v4.1-flash
      esforco: medium
      ativo: true

temas:
  - id: credito
    nome: Crédito
    categorias: [credito, economia, mercado, mundo, brasil]
    # Países aceitos: grupos do paises.yaml (g10, em) e/ou códigos (ex: VEN).
    # Notícia que cita SÓ países fora daqui (ex: Gana, Sri Lanka) sai do tema.
    # Notícia sem país citado (ex: empresa brasileira em RJ) fica.
    paises_permitidos: [g10, em]
    # Opcional: trocar o modelo de uma tarefa só neste tema. Ex:
    # ia:
    #   resumo: { modelo: anthropic/claude-sonnet-5.5 }
    excluir:
      # Dívida de pessoa física (feirões de renegociação etc).
      # Apague estas linhas se quiser receber esse tipo de notícia.
      - Feirão
      - Limpa Nome
      - Desenrola
      - nome sujo
      # Finanças pessoais e ações (não são crédito corporativo/soberano)
      - S&P 500
      - savings
      - APY
      - CD rates
      - dividend stock*
      - high yield stock*
      - high yield dividend*
      - put credit spread*
      - call credit spread*
      - price target*
      - buy rating
      - sell rating
      - hold rating
      - CDS PP

