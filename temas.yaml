  - id: bancos_centrais
    nome: Bancos centrais
    descricao: >-
      Política monetária e bancos centrais: Banco Central do Brasil (Copom,
      Selic, diretoria), Fed, BCE, Banco da Inglaterra, Banco do Japão e Banco
      do Povo da China. Decisões de juros, sinalizações, atas, discursos,
      nomeações, balanço e intervenções no câmbio. Fica fora: bancos centrais de
      outros países, finanças pessoais (hipoteca, poupança, cartão) e cotações
      de mercado sem relação com decisão ou sinalização de banco central.
    categorias: [bancos_centrais, colunista_alex, colunista_timiraos, colunista_wolf, economia, mercado, mundo, brasil]
    excluir:
      - mortgage rate*
      - savings
      - APY
      - CD rates
      - credit card*

    filtros:
