name: Buscar notícias

on:
  workflow_dispatch:
  # O relógio principal é o Supabase (supabase/migracoes/003_agendador.sql),
  # que dispara este workflow 3x ao dia (Brasília 06:53, 12:53 e 18:53).
  # Reserva do GitHub: 30 min depois (07:23, 13:23 e 19:23). Só busca se o
  # Supabase não tiver rodado com sucesso desde o último horário dele.
  schedule:
    - cron: "23 10,16,22 * * *"
  push:
    paths:
      - "n8news/**"
      - "feeds.yaml"
      - "temas.yaml"
      - "paises.yaml"
      - "tests/**"
      - ".github/workflows/buscar-noticias.yml"

# Uma execução por vez (evita duas atualizando o painel ao mesmo tempo)
concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  verificar:
    # Reserva do GitHub: só busca se não houve busca com sucesso desde o último
    # horário do Supabase (09:53, 15:53 ou 21:53 UTC)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      rodar: ${{ steps.v.outputs.rodar }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rodar=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            agora=$(date -u +%s)
            # Último horário do Supabase até agora (hoje ou, de madrugada, ontem 21:53)
            horario=$(date -u -d "yesterday 21:53" +%s)
            for h in 09:53 15:53 21:53; do
              t=$(date -u -d "today $h" +%s)
              [ "$t" -le "$agora" ] && horario=$t
            done
            ultima=$(gh run list -R "$GITHUB_REPOSITORY" --workflow buscar-noticias.yml \
              --branch "${{ github.ref_name }}" --status success --limit 1 \
              --json createdAt -q '.[0].createdAt' || true)
            echo "Horário do Supabase: $(date -u -d @$horario +%FT%TZ); última busca com sucesso: ${ultima:-nenhuma}"
            if [ -n "$ultima" ] && [ "$(date -d "$ultima" +%s)" -ge "$horario" ]; then
              echo "O Supabase já rodou: pulando a reserva."
              rodar=false
            fi
          fi
          echo "rodar=$rodar" >> "$GITHUB_OUTPUT"

  buscar:
    needs: verificar
    if: needs.verificar.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Testes
        run: python -m pytest -q
      - name: Buscar notícias e gerar o painel
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          # E-mail desligado. Para voltar a receber por e-mail, crie a variável
          # ENVIAR_EMAIL = true em Settings → Secrets and variables → Actions →
          # Variables (e os secrets do Gmail). Só envia nos horários agendados
          # ou rodando manualmente, nunca a cada mudança no código.
          ENVIAR: ${{ vars.ENVIAR_EMAIL == 'true' && github.event_name != 'push' && '--enviar-email' || '' }}
        run: python -m n8news --json noticias.json --painel site --salvar-email email.html $ENVIAR
      - uses: actions/upload-artifact@v4
        with:
          name: noticias
          path: |
            noticias.json
            email.html
            site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    # Publica o painel no GitHub Pages (só a partir do branch principal)
    needs: buscar
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
